name: build-m1n1

on:
  workflow_dispatch:
  push:
    branches: [ main, ipad-air-5, 'integration/**' ]
    paths:
      - '.github/workflows/m1n1.yml'
      - 'docs/m1n1-integration.md'
      - 'integration/m1n1/**'
      - 'src/boot/m1n1_handoff.*'
      - 'src/boot/boot_info.h'
      - 'tests/m1n1_handoff_test.c'
  pull_request:
    branches: [ main, ipad-air-5 ]
    paths:
      - '.github/workflows/m1n1.yml'
      - 'docs/m1n1-integration.md'
      - 'integration/m1n1/**'
      - 'src/boot/m1n1_handoff.*'
      - 'src/boot/boot_info.h'
      - 'tests/m1n1_handoff_test.c'

jobs:
  m1n1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ipad-linux
        uses: actions/checkout@v4
        with:
          path: ipad-linux

      - name: Checkout upstream m1n1
        uses: actions/checkout@v4
        with:
          repository: AsahiLinux/m1n1
          submodules: recursive
          path: m1n1

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            gcc-aarch64-linux-gnu \
            libgnutls28-dev \
            device-tree-compiler

      - name: Install bare-metal Rust target
        run: rustup target install aarch64-unknown-none-softfloat

      - name: Verify upstream next-stage, SMP and ADT proxy API contract
        run: |
          grep -q 'void smp_start_secondaries(void)' m1n1/src/smp.h
          grep -q 'uint64_t smp_get_mpidr(int cpu)' m1n1/src/smp.h
          grep -q 'u64 smp_get_release_addr(int cpu)' m1n1/src/smp.h
          grep -q 'void smp_set_wfe_mode(bool new_mode)' m1n1/src/smp.h
          grep -q 'extern struct vector_args next_stage' m1n1/src/utils.h
          grep -q 'extern struct boot_args cur_boot_args' m1n1/src/xnuboot.h
          grep -q 'extern void \*adt' m1n1/src/adt.h
          grep -q 'def get_adt(self):' m1n1/proxyclient/m1n1/proxyutils.py
          grep -q 'adt_base = (self.ba.devtree - self.ba.virt_base + self.ba.phys_base)' \
            m1n1/proxyclient/m1n1/proxyutils.py

      - name: Check live ADT dump helper
        run: |
          python3 -m py_compile ipad-linux/integration/m1n1/dump_live_adt.py
          grep -q 'u.get_adt()' ipad-linux/integration/m1n1/dump_live_adt.py

      - name: Test ipad-linux handoff builder
        run: |
          mkdir -p ipad-linux/build
          clang -std=c17 -Wall -Wextra -Werror \
            -Iipad-linux/src/boot \
            ipad-linux/tests/m1n1_handoff_test.c \
            ipad-linux/src/boot/m1n1_handoff.c \
            -o ipad-linux/build/m1n1_handoff_test
          ipad-linux/build/m1n1_handoff_test

      - name: Compile J407 overlay with m1n1 flags
        run: |
          mkdir -p ipad-linux/build
          make -C m1n1 invoke_cc ARCH=aarch64-linux-gnu- \
            CFILE="$GITHUB_WORKSPACE/ipad-linux/integration/m1n1/ipad_linux_adapter.c" \
            OBJFILE="$GITHUB_WORKSPACE/ipad-linux/build/ipad_linux_adapter.o"
          make -C m1n1 invoke_cc ARCH=aarch64-linux-gnu- \
            CFILE="$GITHUB_WORKSPACE/ipad-linux/src/boot/m1n1_handoff.c" \
            OBJFILE="$GITHUB_WORKSPACE/ipad-linux/build/m1n1_handoff.o"
          aarch64-linux-gnu-ld -r \
            ipad-linux/build/ipad_linux_adapter.o \
            ipad-linux/build/m1n1_handoff.o \
            -o ipad-linux/build/ipad_linux_m1n1_overlay.o
          test -s ipad-linux/build/ipad_linux_m1n1_overlay.o
          ! aarch64-linux-gnu-nm -u ipad-linux/build/ipad_linux_m1n1_overlay.o \
            | grep -q 'm1n1_handoff_build'

      - name: Build upstream m1n1
        working-directory: m1n1
        run: make -k -j2 ARCH=aarch64-linux-gnu- RELEASE=1

      - name: Verify raw entry point exists
        run: |
          test -s m1n1/build/m1n1.bin
          test $(stat -c%s m1n1/build/m1n1.bin) -gt 2048

      - name: Upload m1n1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: j407-next-stage-m1n1
          path: |
            m1n1/build/m1n1.bin
            ipad-linux/build/ipad_linux_m1n1_overlay.o
