name: j407-first-boot-image

on:
  workflow_dispatch:
  push:
    branches: [ ipad-air-5, 'integration/**' ]
    paths:
      - '.github/workflows/j407-image.yml'
      - 'Makefile'
      - 'src/**'
      - 'dts/**'
      - 'kernel/**'
      - 'initramfs/**'
      - 'docs/first-boot.md'
      - 'integration/m1n1/dump_live_adt.py'
      - 'tools/analyze-first-boot.py'
      - 'tools/build-hardware-report.py'
      - 'tools/host-preflight.py'
      - 'tools/verify-first-boot-kit.py'
      - 'scripts/build-initramfs.sh'
      - 'scripts/check-j407-dtb.sh'
      - 'scripts/pack-m1n1-j407.py'
  pull_request:
    branches: [ ipad-air-5 ]
    paths:
      - '.github/workflows/j407-image.yml'
      - 'Makefile'
      - 'src/**'
      - 'dts/**'
      - 'kernel/**'
      - 'initramfs/**'
      - 'docs/first-boot.md'
      - 'integration/m1n1/dump_live_adt.py'
      - 'tools/analyze-first-boot.py'
      - 'tools/build-hardware-report.py'
      - 'tools/host-preflight.py'
      - 'tools/verify-first-boot-kit.py'
      - 'scripts/build-initramfs.sh'
      - 'scripts/check-j407-dtb.sh'
      - 'scripts/pack-m1n1-j407.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ipad-linux
        uses: actions/checkout@v4
        with:
          path: ipad-linux

      - name: Checkout current mainline Linux
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          path: linux
          fetch-depth: 1

      - name: Checkout current upstream m1n1
        uses: actions/checkout@v4
        with:
          repository: AsahiLinux/m1n1
          submodules: recursive
          path: m1n1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            bc bison flex libssl-dev libelf-dev libgnutls28-dev \
            device-tree-compiler cpio file python3
          rustup target install aarch64-unknown-none-softfloat

      - name: Apply J407 kernel patch series
        working-directory: linux
        run: |
          for patch in ../ipad-linux/kernel/patches/*.patch; do
            echo "applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check

      - name: Build ipad-linux diagnostic Stage 2
        working-directory: ipad-linux
        run: |
          make
          test -s build/payload.bin
          llvm-readelf -h build/payload.elf
          if llvm-readelf -r build/payload.elf | grep -q 'R_AARCH64_'; then
            echo 'ipad-linux payload contains runtime relocations'
            exit 1
          fi

      - name: Build ARM64 bring-up initramfs
        working-directory: ipad-linux
        run: |
          CROSS_COMPILE=aarch64-linux-gnu- \
            sh scripts/build-initramfs.sh build/initramfs
          test -s build/initramfs/initramfs.cpio.gz

      - name: Overlay J407 DTS into mainline
        run: |
          cp ipad-linux/dts/t8103-j407.dts \
            linux/arch/arm64/boot/dts/apple/t8103-j407.dts
          cp ipad-linux/dts/t8103-j407-touch-foundation.dtsi \
            linux/arch/arm64/boot/dts/apple/t8103-j407-touch-foundation.dtsi
          printf '%s\n' 'dtb-$(CONFIG_ARCH_APPLE) += t8103-j407.dtb' \
            >> linux/arch/arm64/boot/dts/apple/Makefile

      - name: Configure mainline for J407 bring-up
        working-directory: linux
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/kconfig/merge_config.sh -m .config \
            ../ipad-linux/kernel/j407-bringup.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          for option in \
            ARCH_APPLE PINCTRL_APPLE_GPIO \
            SERIAL_SAMSUNG SERIAL_SAMSUNG_CONSOLE \
            APPLE_MAILBOX APPLE_RTKIT APPLE_SART APPLE_DART \
            NVME_APPLE PCI PCIE_APPLE \
            RFKILL CFG80211 WLAN BRCMFMAC BRCMFMAC_PCIE \
            BT BT_HCIBCM4377 FW_LOADER \
            USB USB_DWC3 USB_DWC3_DUAL_ROLE USB_ROLE_SWITCH \
            TYPEC PHY_APPLE_ATC I2C I2C_APPLE TYPEC_TPS6598X \
            DRM DRM_SIMPLEDRM DRM_FBDEV_EMULATION \
            VT VT_CONSOLE FRAMEBUFFER_CONSOLE; do
              grep -q "^CONFIG_${option}=y" .config || {
                echo "CONFIG_${option}=y was not resolved"
                exit 1
              }
          done

      - name: Build mainline Linux Image and arm64 DTBs
        working-directory: linux
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image dtbs
          test -s arch/arm64/boot/Image
          test -s arch/arm64/boot/dts/apple/t8103-j407.dtb

      - name: Validate compiled J407 DTB
        run: |
          mkdir -p ipad-linux/build/j407
          sh ipad-linux/scripts/check-j407-dtb.sh \
            linux/arch/arm64/boot/dts/apple/t8103-j407.dtb
          dtc -I dtb -O dts \
            linux/arch/arm64/boot/dts/apple/t8103-j407.dtb \
            -o ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'apple,j407' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'serial@235200000' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'framebuffer@0' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'nvme@27bcc0000' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'usb@382280000' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'usb-pd@38' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'apple,cd321x' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'pci14e4,4433' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'pci14e4,5f71' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'apple,lycheea' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'pinctrl@24a820000' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'pinctrl@23d1f0000' ipad-linux/build/j407/t8103-j407.compiled.dts
          grep -q 'earlycon console=tty0 console=ttySAC0,115200 loglevel=8' \
            ipad-linux/build/j407/t8103-j407.compiled.dts

      - name: Build upstream m1n1
        working-directory: m1n1
        run: |
          make -j2 ARCH=aarch64-linux-gnu- RELEASE=1
          test -s build/m1n1.bin

      - name: Pack native m1n1 payload chain
        working-directory: ipad-linux
        run: |
          python3 scripts/pack-m1n1-j407.py \
            --m1n1 ../m1n1/build/m1n1.bin \
            --dtb ../linux/arch/arm64/boot/dts/apple/t8103-j407.dtb \
            --initramfs build/initramfs/initramfs.cpio.gz \
            --image ../linux/arch/arm64/boot/Image \
            --output build/j407/j407-m1n1-linux.bin \
            --manifest build/j407/j407-m1n1-linux.manifest.txt
          test -s build/j407/j407-m1n1-linux.bin

      - name: Assemble hardware-test kit
        run: |
          cp linux/arch/arm64/boot/Image ipad-linux/build/j407/Image
          cp linux/arch/arm64/boot/dts/apple/t8103-j407.dtb \
            ipad-linux/build/j407/t8103-j407.dtb
          cp ipad-linux/build/initramfs/initramfs.cpio.gz \
            ipad-linux/build/j407/initramfs.cpio.gz
          cp m1n1/build/m1n1.bin ipad-linux/build/j407/m1n1.bin
          cp linux/.config ipad-linux/build/j407/linux.config
          cp ipad-linux/build/payload.bin ipad-linux/build/j407/ipad-linux-stage2.bin
          cp ipad-linux/docs/first-boot.md ipad-linux/build/j407/HARDWARE_TEST.md
          cp ipad-linux/tools/analyze-first-boot.py ipad-linux/build/j407/analyze-first-boot.py
          cp ipad-linux/tools/build-hardware-report.py ipad-linux/build/j407/build-hardware-report.py
          cp ipad-linux/tools/host-preflight.py ipad-linux/build/j407/host-preflight.py
          cp ipad-linux/tools/verify-first-boot-kit.py ipad-linux/build/j407/verify-first-boot-kit.py
          cp ipad-linux/integration/m1n1/dump_live_adt.py ipad-linux/build/j407/dump_live_adt.py

          {
            echo "product_type=iPad13,16"
            echo "board_config=J407AP"
            echo "model=A2588"
            echo "soc=T8103 / Apple M1"
            echo "cpid=0x8103"
            echo "bdid=0x10"
            echo "reported_ipados=26.5"
            echo "public_26.5_build=23F77"
          } > ipad-linux/build/j407/TARGET

          {
            echo "ipad-linux=$(git -C ipad-linux rev-parse HEAD)"
            echo "linux=$(git -C linux rev-parse HEAD)"
            echo "m1n1=$(git -C m1n1 rev-parse HEAD)"
          } > ipad-linux/build/j407/SOURCE_COMMITS

          (
            cd ipad-linux/build/j407
            sha256sum * > SHA256SUMS
            ! grep -q '/' SHA256SUMS
          )
          ls -lh ipad-linux/build/j407
          cat ipad-linux/build/j407/SOURCE_COMMITS

      - name: Self-verify hardware-test kit
        working-directory: ipad-linux
        run: |
          python3 tools/verify-first-boot-kit.py build/j407

      - name: Upload J407 first-boot hardware-test kit
        uses: actions/upload-artifact@v4
        with:
          name: j407-first-boot-image
          path: ipad-linux/build/j407/
