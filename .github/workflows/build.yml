name: build

on:
  push:
  pull_request:

jobs:
  baremetal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build payload
        run: make

      - name: Verify position independence
        run: |
          llvm-readelf -h build/payload.elf
          llvm-readelf -r build/payload.elf
          if llvm-readelf -r build/payload.elf | grep -q 'R_AARCH64_'; then
            echo 'payload contains runtime relocations'
            exit 1
          fi

      - name: Run ADT parser tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/adt tests/adt_test.c src/adt/adt.c -o build/adt_test
          ./build/adt_test

      - name: Show image information
        run: |
          llvm-size build/payload.elf
          llvm-nm -n build/payload.elf | head -40

      - name: Upload payload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipad-air-5-payload
          path: |
            build/payload.elf
            build/payload.bin
            build/payload.dis
