name: build

on:
  push:
  pull_request:

jobs:
  baremetal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build payload
        run: make

      - name: Show ELF information
        run: |
          llvm-readelf -h build/payload.elf
          llvm-size build/payload.elf

      - name: Upload payload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipad-linux-payload
          path: |
            build/payload.elf
            build/payload.bin
            build/payload.dis
