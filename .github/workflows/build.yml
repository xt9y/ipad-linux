name: build

on:
  push:
  pull_request:

jobs:
  baremetal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build/test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm device-tree-compiler

      - name: Build payload
        run: make

      - name: Verify position independence
        run: |
          llvm-readelf -h build/payload.elf
          llvm-readelf -r build/payload.elf
          if llvm-readelf -r build/payload.elf | grep -q 'R_AARCH64_'; then
            echo 'payload contains runtime relocations'
            exit 1
          fi

      - name: Run ADT parser tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/adt tests/adt_test.c src/adt/adt.c -o build/adt_test
          ./build/adt_test

      - name: Run ADT reg translation tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/adt tests/adt_reg_test.c src/adt/adt.c src/adt/adt_reg.c -o build/adt_reg_test
          ./build/adt_reg_test

      - name: Run ADT function decoder tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/adt \
            tests/adt_function_test.c src/adt/adt_function.c src/adt/adt.c \
            -o build/adt_function_test
          ./build/adt_function_test

      - name: Run J407 discovery tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror \
            -Isrc/adt -Isrc/platform/j407 \
            tests/j407_discovery_test.c src/platform/j407/discovery.c \
            src/adt/adt.c src/adt/adt_reg.c src/adt/adt_function.c \
            -o build/j407_discovery_test
          ./build/j407_discovery_test

      - name: Run boot ABI tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/boot tests/boot_info_test.c -o build/boot_info_test
          ./build/boot_info_test

      - name: Run m1n1 handoff builder tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/boot \
            tests/m1n1_handoff_test.c src/boot/m1n1_handoff.c \
            -o build/m1n1_handoff_test
          ./build/m1n1_handoff_test

      - name: Run Linux boot-plan tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/boot -Isrc/memory tests/linux_boot_test.c src/boot/linux_image.c src/boot/boot_plan.c src/memory/memory.c -o build/linux_boot_test
          ./build/linux_boot_test

      - name: Run FDT builder tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/fdt tests/fdt_test.c src/fdt/fdt.c -o build/fdt_test
          ./build/fdt_test build/test.dtb
          dtc -I dtb -O dts build/test.dtb -o build/test.dts
          grep -q 'apple,j407' build/test.dts

      - name: Run Linux FDT runtime patch tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror -Isrc/boot -Isrc/fdt -Isrc/memory \
            tests/linux_fdt_test.c src/boot/linux_fdt.c src/fdt/fdt.c src/memory/memory.c \
            -o build/linux_fdt_test
          ./build/linux_fdt_test

      - name: Run J407 SMP contract tests
        run: |
          clang -std=c17 -Wall -Wextra -Werror \
            -Isrc/boot -Isrc/fdt -Isrc/memory -Isrc/platform/j407 \
            tests/j407_smp_test.c src/platform/j407/smp_contract.c src/memory/memory.c \
            -o build/j407_smp_test
          ./build/j407_smp_test

      - name: Show image information
        run: |
          llvm-size build/payload.elf
          llvm-nm -n build/payload.elf | head -80

      - name: Upload payload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipad-air-5-payload
          path: |
            build/payload.elf
            build/payload.bin
            build/payload.dis
            build/test.dtb
            build/test.dts
