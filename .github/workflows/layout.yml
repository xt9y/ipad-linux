name: layout

on:
  push:
    branches: [ ipad-air-5 ]
    paths:
      - '.github/workflows/layout.yml'
      - 'src/boot/linux_layout.*'
      - 'src/boot/boot_plan.*'
      - 'src/memory/**'
      - 'tests/linux_layout_test.c'
  pull_request:
    branches: [ ipad-air-5 ]
    paths:
      - '.github/workflows/layout.yml'
      - 'src/boot/linux_layout.*'
      - 'src/boot/boot_plan.*'
      - 'src/memory/**'
      - 'tests/linux_layout_test.c'

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run layout tests
        run: |
          mkdir -p build
          clang -std=c17 -Wall -Wextra -Werror \
            -Isrc/boot -Isrc/memory \
            tests/linux_layout_test.c \
            src/boot/linux_layout.c src/boot/boot_plan.c src/memory/memory.c \
            -o build/linux_layout_test
          ./build/linux_layout_test
